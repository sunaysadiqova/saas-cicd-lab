name: SaaS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: saas-task-manager

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Kodu yüklə
        uses: actions/checkout@v4

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Asılılıqları quraşdır
        run: pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8 app.py test_app.py --max-line-length=100

      - name: Unit testlər
        run: pytest -v

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Kodu yüklə
        uses: actions/checkout@v4

      - name: Docker image hazırla
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Konteyneri işə sal
        run: docker run -d -p 5000:5000 --name app $IMAGE_NAME:${{ github.sha }}

      - name: Smoke test
        run: |
          sleep 5
          curl -f http://localhost:5000/health

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Staging mühitinə deploy
        run: |
          echo "Versiya: ${{ github.sha }}"
          echo "Tətbiq staging mühitinə göndərilir..."
          echo "Deploy uğurla tamamlandı"
